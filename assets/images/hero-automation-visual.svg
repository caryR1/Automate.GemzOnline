<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d">
<title id="t">AI lead response automation</title><desc id="d">Incoming customer call is answered by AI, then the lead is captured, followed up by text, and sent a review request.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#06162d"/><stop offset="1" stop-color="#082b58"/></linearGradient><linearGradient id="blue" x1="0" x2="1"><stop stop-color="#0878f9"/><stop offset="1" stop-color="#38b6ff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="900" height="560" rx="30" fill="url(#bg)"/>
<g filter="url(#glow)" fill="none" stroke="#21a2ff" stroke-width="4"><path d="M245 280 C310 280 300 340 360 340"/><path d="M535 280 C590 280 570 125 625 125"/><path d="M535 290 C590 290 575 280 625 280"/><path d="M535 300 C590 300 575 435 625 435"/></g>
<g transform="translate(55 70)"><rect width="210" height="410" rx="32" fill="#07101f" stroke="#309cff" stroke-width="4"/><rect x="22" y="22" width="166" height="365" rx="23" fill="#0b1b33"/><text x="105" y="85" text-anchor="middle" fill="#fff" font-family="Arial" font-size="22" font-weight="700">Incoming Call</text><text x="105" y="112" text-anchor="middle" fill="#9fb4cf" font-family="Arial" font-size="14">Potential Customer</text><circle cx="105" cy="185" r="48" fill="#3b526f"/><circle cx="105" cy="170" r="18" fill="#a8b9cc"/><path d="M70 220c9-31 61-31 70 0" fill="#a8b9cc"/><rect x="38" y="250" width="134" height="58" rx="13" fill="#152b49"/><text x="105" y="274" text-anchor="middle" fill="#fff" font-family="Arial" font-size="13">“I'd like a quote</text><text x="105" y="293" text-anchor="middle" fill="#fff" font-family="Arial" font-size="13">for a new roof.”</text><circle cx="70" cy="345" r="28" fill="#ef4444"/><circle cx="140" cy="345" r="28" fill="#22c55e"/><text x="70" y="352" text-anchor="middle" fill="#fff" font-size="23">×</text><text x="140" y="352" text-anchor="middle" fill="#fff" font-size="22">☎</text></g>
<g transform="translate(330 165)"><circle cx="105" cy="105" r="92" fill="#e8f3ff" stroke="#168dff" stroke-width="5"/><rect x="47" y="55" width="116" height="94" rx="42" fill="#07162d" stroke="#62bdff" stroke-width="4"/><path d="M75 105q14-20 28 0M125 105q14-20 28 0" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/><path d="M38 84q-18 24 0 48M172 84q18 24 0 48" fill="none" stroke="#168dff" stroke-width="13" stroke-linecap="round"/><path d="M70 155h70l18 52H52z" fill="url(#blue)"/><text x="105" y="191" text-anchor="middle" fill="#fff" font-family="Arial" font-size="32" font-weight="800">A</text><text x="105" y="240" text-anchor="middle" fill="#fff" font-family="Arial" font-size="22" font-weight="700">AI Answers</text><text x="105" y="265" text-anchor="middle" fill="#7dc8ff" font-family="Arial" font-size="15">instantly, 24/7</text></g>
<g font-family="Arial"><g transform="translate(625 65)"><rect width="225" height="120" rx="18" fill="#f7fbff"/><rect x="18" y="28" width="52" height="52" rx="12" fill="#0878f9"/><text x="44" y="62" text-anchor="middle" fill="#fff" font-size="26">●</text><text x="84" y="49" fill="#08214a" font-size="20" font-weight="700">Lead Captured</text><text x="84" y="74" fill="#617895" font-size="13">Name • Phone • Details</text><circle cx="197" cy="58" r="21" fill="#22c55e"/><text x="197" y="66" text-anchor="middle" fill="#fff" font-size="24">✓</text></g>
<g transform="translate(625 220)"><rect width="225" height="120" rx="18" fill="#f7fbff"/><rect x="18" y="28" width="52" height="52" rx="12" fill="#0878f9"/><text x="44" y="62" text-anchor="middle" fill="#fff" font-size="24">✉</text><text x="84" y="49" fill="#08214a" font-size="20" font-weight="700">Follow-Up Sent</text><text x="84" y="74" fill="#617895" font-size="13">Text with next steps</text><circle cx="197" cy="58" r="21" fill="#22c55e"/><text x="197" y="66" text-anchor="middle" fill="#fff" font-size="24">✓</text></g>
<g transform="translate(625 375)"><rect width="225" height="120" rx="18" fill="#f7fbff"/><rect x="18" y="28" width="52" height="52" rx="12" fill="#0878f9"/><text x="44" y="63" text-anchor="middle" fill="#fff" font-size="25">★</text><text x="84" y="49" fill="#08214a" font-size="20" font-weight="700">Review Request</text><text x="84" y="74" fill="#617895" font-size="13">Sent after the job</text><circle cx="197" cy="58" r="21" fill="#22c55e"/><text x="197" y="66" text-anchor="middle" fill="#fff" font-size="24">✓</text></g></g>
<text x="435" y="52" text-anchor="middle" fill="#d9edff" font-family="Arial" font-size="18">“Hi! Thanks for calling. How can I help?”</text>
